<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>장터에서 독립운동가를?</title>
  <style>
    body {
      margin: 0;
      height: 100vh; /* 화면 전체 높이 */
      background-image: url('milbg.png'); /* 배경 이미지 */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    iframe {
      width: 90%;            /* 화면 거의 꽉 차게 */
      max-width: 900px;      /* 너무 넓어지지 않도록 */
      height: 500px;         /* 기본 높이 */
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    /* 모바일 대응 iframe */
    @media (max-width: 768px) {
      iframe {
        height: 320px;       /* 태블릿/중형 화면 */
      }
    }

    @media (max-width: 480px) {
      iframe {
        height: 220px;       /* 스마트폰 */
      }
    }
    .content {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 30px; /* 기존 20px → 30px */
      border-radius: 10px;
      display: inline-block;
    }

    .content h1 {
      font-size: 28px; /* 제목 크기 확대 */
    }

    .content p {
      font-size: 20px; /* 본문 글자 크기 확대 */
      line-height: 1.5; /* 줄간격 확보 */
    }

    input, button {
      font-size: 18px; /* 입력창/버튼 글자 크기 확대 */
      padding: 15px 20px; /* 내부 여백 확대 */
      border-radius: 8px;
      margin: 10px;
    }

    /* 모바일 대응 */
  @media (max-width: 768px) {
    .content {
      padding: 20px;
    }

    .content h1 {
      font-size: 22px; /* 모바일에서 제목 크기 */
    }

    .content p {
      font-size: 18px; /* 모바일에서 본문 크기 */
    }

    input, button {
      font-size: 16px;
      padding: 12px 15px;
    }
  }

  @media (max-width: 480px) {
    .content h1 {
      font-size: 20px;
    }

    .content p {
      font-size: 16px;
    }

    input, button {
      font-size: 14px;
      padding: 10px 12px;
    }
  }
  
    img {
      width: 60%;
      max-width: 600px;
      margin: 20px 0;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- 영상과 본문 사이 이미지 -->
  <img src="milyang02.png" alt="설명 이미지">

  <div class="content">
    <h1>장터에서 독립운동가를?</h1>
    <p>다음 지령을 받기 위해서는 장터에서 독립운동가의 흔적을 찾아야 한다.<br>
       올바른 장소를 찾아갔다면 다음 네자리 숫자의 암호를 알 수 있을것이다.</p>
    <input type="text" id="answer" placeholder="암호를 입력하시오">
    <button onclick="checkAnswer()">제출</button>
    <p id="result"></p>
  </div>

  <script>
    function checkAnswer() {
      const answer = document.getElementById('answer').value.trim();
      if (answer === "1945") {
        document.getElementById('result').textContent = "정답입니다!";
        setTimeout(() => {
          // 정답이면 유튜브 영상 페이지로 이동
          window.location.href = "https://shar0709.github.io/mil1/mil21.html";
        }, 2000); // 2초 후 이동
      } else {
        document.getElementById('result').textContent = "틀렸습니다!";
      }
    }
  </script>
</body>
</html>
