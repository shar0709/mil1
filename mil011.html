<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>영남제일루</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-image: url('milbg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px; /* 상단 여백 */
    }

    iframe {
      width: 80%;
      max-width: 800px;
      height: 450px;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .content {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 30px;
      border-radius: 10px;
      display: inline-block;
    }

    .content h1 {
      font-size: 28px;
    }

    .content p {
      font-size: 20px;
      line-height: 1.5;
    }

    input, button {
      font-size: 18px;
      padding: 15px 20px;
      border-radius: 8px;
      margin: 10px;
    }

    img {
      width: 60%;
      max-width: 600px;
      margin: 20px 0;
      border-radius: 10px;
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {
      iframe {
        height: 300px;
      }
      .content {
        padding: 20px;
      }
      .content h1 {
        font-size: 22px;
      }
      .content p {
        font-size: 18px;
      }
      input, button {
        font-size: 16px;
        padding: 12px 15px;
      }
    }

    @media (max-width: 480px) {
      iframe {
        height: 200px;
      }
      .content h1 {
        font-size: 20px;
      }
      .content p {
        font-size: 16px;
      }
      input, button {
        font-size: 14px;
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- 영상 -->
  <iframe src="https://naver.me/GScykvz0" allow="autoplay; encrypted-media" allowfullscreen></iframe>

  <!-- 영상과 본문 사이 이미지 -->
  <img src="milyang01.png" alt="설명 이미지">

  <div class="content">
    <h1>다음 지령</h1>
    <p>남자는 장터로 와서 지령서를 찾으라고 한다. <br>
       뭔가 더 단서가 될만한건 없을까?<br>
       문득 바닥을 보니 쪽지가 하나 떨어져 있다. <br>
       "장터로 가면 우리 요원의 흔적을 찾을 수 있을거요"<br>
       독립운동가의 흔적을 찾아야 하는걸까? <br>
       아무래도 세번째 지령서를 확인해봐야 될 것 같다.<br>
  </div>
</body>
</html>
