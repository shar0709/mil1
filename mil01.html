<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>영남제일루</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-image: url('milbg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px; /* 상단 여백 */
    }

    iframe {
      width: 80%;
      max-width: 800px;
      height: 450px;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .content {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 30px;
      border-radius: 10px;
      display: inline-block;
    }

    .content h1 {
      font-size: 28px;
    }

    .content p {
      font-size: 20px;
      line-height: 1.5;
    }

    input, button {
      font-size: 18px;
      padding: 15px 20px;
      border-radius: 8px;
      margin: 10px;
    }

    img {
      width: 60%;
      max-width: 600px;
      margin: 20px 0;
      border-radius: 10px;
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {
      iframe {
        height: 300px;
      }
      .content {
        padding: 20px;
      }
      .content h1 {
        font-size: 22px;
      }
      .content p {
        font-size: 18px;
      }
      input, button {
        font-size: 16px;
        padding: 12px 15px;
      }
    }

    @media (max-width: 480px) {
      iframe {
        height: 200px;
      }
      .content h1 {
        font-size: 20px;
      }
      .content p {
        font-size: 16px;
      }
      input, button {
        font-size: 14px;
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- 영상 -->


  <!-- 영상과 본문 사이 이미지 -->
  <img src="milyang01.png" alt="설명 이미지">

  <div class="content">
    <h1>과거와의 통신</h1>
    <p>우리와 연결하기 위한 암호를 알려주겠네<br>
       자네가 장소를 제대로 찾아갔다면 그곳에 현판이 보일걸세.<br>
       그 현판에는 숫자가 써 있을텐데 그것이 쓰여진 해를 나타낸다고 하더군.<br>
       암호는 바로 그 년도일세. 당신이 우리와 같은 단군의 후예라면 아주 쉽게 알 수 있겠지...</p>
    <input type="text" id="answer" placeholder="연결을 위한 암호를 입력하시오">
    <button onclick="checkAnswer()">제출</button>
    <p id="result"></p>
  </div>

  <script>
    function checkAnswer() {
      const answer = document.getElementById('answer').value.trim();
      if (answer === "1957") {
        document.getElementById('result').textContent = "정답입니다!";
        setTimeout(() => {
          window.location.href = "https://shar0709.github.io/mil1/mil01.html";
        }, 2000);
      } else {
        document.getElementById('result').textContent = "틀렸습니다!";
      }
    }
  </script>
</body>
</html>
