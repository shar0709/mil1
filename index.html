<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>독립을 위한 첫번째 여정</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-image: url('milbg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px; /* 상단 여백 */
    }

    iframe {
      width: 80%;
      max-width: 800px;
      height: 450px;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .content {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 30px;
      border-radius: 10px;
      display: inline-block;
    }

    .content h1 {
      font-size: 28px;
    }

    .content p {
      font-size: 20px;
      line-height: 1.5;
    }

    input, button {
      font-size: 18px;
      padding: 15px 20px;
      border-radius: 8px;
      margin: 10px;
    }

    img {
      width: 60%;
      max-width: 600px;
      margin: 20px 0;
      border-radius: 10px;
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {
      iframe {
        height: 300px;
      }
      .content {
        padding: 20px;
      }
      .content h1 {
        font-size: 22px;
      }
      .content p {
        font-size: 18px;
      }
      input, button {
        font-size: 16px;
        padding: 12px 15px;
      }
    }

    @media (max-width: 480px) {
      iframe {
        height: 200px;
      }
      .content h1 {
        font-size: 20px;
      }
      .content p {
        font-size: 16px;
      }
      input, button {
        font-size: 14px;
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- 영상 -->
  <iframe src="https://naver.me/FDGLJF7a" allow="autoplay; encrypted-media" allowfullscreen></iframe>

  <!-- 영상과 본문 사이 이미지 -->
  <img src="mil1.png" alt="설명 이미지">

  <div class="content">
    <h1>독립을 위한 첫번째 여정</h1>
    <p>느닷없이 나타나 자신을 독립군이라고 말한 남자. 그 남자가 떠난 자리에는 쪽지가 하나 남겨져 있다.<br>'영남 제일루의 파도를 막는 누각으로 오시오.'</p>
  </div>

  <script>
    function checkAnswer() {
      const answer = document.getElementById('answer').value.trim();
      if (answer === "4290") {
        document.getElementById('result').textContent = "정답입니다! 영상으로 이동합니다.";
        setTimeout(() => {
          window.location.href = "https://www.youtube.com/embed/bPFmdF1_2aU?autoplay=1&mute=1";
        }, 2000);
      } else {
        document.getElementById('result').textContent = "틀렸습니다!";
      }
    }
  </script>
</body>
</html>
