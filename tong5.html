<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>길</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-image: url('tong12.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;

      padding-top: 100px; /* 화면 위쪽에 여백 추가 */
    }
    iframe {
      width: 90%;            /* 화면 거의 꽉 차게 */
      max-width: 900px;      /* 너무 넓어지지 않도록 */
      height: 500px;         /* 기본 높이 */
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    /* 모바일 대응 iframe */
    @media (max-width: 768px) {
      iframe {
        height: 320px;       /* 태블릿/중형 화면 */
      }
    }

    @media (max-width: 480px) {
      iframe {
        height: 220px;       /* 스마트폰 */
      }
    }
    .content {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 30px; /* 기존 20px → 30px */
      border-radius: 10px;
      display: inline-block;
    }

    .content h1 {
      font-size: 28px; /* 제목 크기 확대 */
    }

    .content p {
      font-size: 20px; /* 본문 글자 크기 확대 */
      line-height: 1.5; /* 줄간격 확보 */
    }

    input, button {
      font-size: 18px; /* 입력창/버튼 글자 크기 확대 */
      padding: 15px 20px; /* 내부 여백 확대 */
      border-radius: 8px;
      margin: 10px;
    }

    /* 모바일 대응 */
  @media (max-width: 768px) {
    .content {
      padding: 20px;
    }

    .content h1 {
      font-size: 22px; /* 모바일에서 제목 크기 */
    }

    .content p {
      font-size: 18px; /* 모바일에서 본문 크기 */
    }

    input, button {
      font-size: 16px;
      padding: 12px 15px;
    }
  }

  @media (max-width: 480px) {
    .content h1 {
      font-size: 20px;
    }

    .content p {
      font-size: 16px;
    }

    input, button {
      font-size: 14px;
      padding: 10px 12px;
    }
  }
  
    img {
      width: 60%;
      max-width: 600px;
      margin: 20px 0;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <iframe src="https://naver.me/FXkmz9oY" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  <!-- 영상과 본문 사이 이미지 -->
  <img src="tong 51.png" alt="설명 이미지">

  <div class="content">
    <h1>단서5.길</h1>
    <p>시가 쓰여져 있는곳을 찾았나요?<br>그렇다면 답을 알 수 있을것입니다.<br>시조시인이자 화가, 서예가이며 통영의 대표 예술가 중 한명인 이 사람은 누구일까요?</p>
    <input type="text" id="answer" placeholder="이 사람의 이름은?">
    <button onclick="checkAnswer()">제출</button>
    <p id="result"></p>
  </div>

  <script>
    function checkAnswer() {
      const answer = document.getElementById('answer').value.trim();
      if (answer === "1") {
        document.getElementById('result').textContent = "정답입니다!";
        setTimeout(() => {
          // 정답이면 유튜브 영상 페이지로 이동
          window.location.href = "https://shar0709.github.io/mil1/tong51.html";
        }, 2000); // 2초 후 이동
      } else {
        document.getElementById('result').textContent = "틀렸습니다!";
      }
    }
  </script>
</body>
</html>
