<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-image: url('milbg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px; /* 상단 여백 */
    }

    iframe {
      width: 80%;
      max-width: 800px;
      height: 450px;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .content {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 30px;
      border-radius: 10px;
      display: inline-block;
    }

    .content h1 {
      font-size: 28px;
    }

    .content p {
      font-size: 20px;
      line-height: 1.5;
    }

    input, button {
      font-size: 18px;
      padding: 15px 20px;
      border-radius: 8px;
      margin: 10px;
    }

    img {
      width: 60%;
      max-width: 600px;
      margin: 20px 0;
      border-radius: 10px;
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {
      iframe {
        height: 300px;
      }
      .content {
        padding: 20px;
      }
      .content h1 {
        font-size: 22px;
      }
      .content p {
        font-size: 18px;
      }
      input, button {
        font-size: 16px;
        padding: 12px 15px;
      }
    }

    @media (max-width: 480px) {
      iframe {
        height: 200px;
      }
      .content h1 {
        font-size: 20px;
      }
      .content p {
        font-size: 16px;
      }
      input, button {
        font-size: 14px;
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- 영상 -->
  <iframe src="https://naver.me/GZ6GxEQE" allow="autoplay; encrypted-media" allowfullscreen></iframe>

  <!-- 영상과 본문 사이 이미지 -->
    <div class="content">
    <h1>축하합니다!</h1>
    <p>당신은 밀양의 독립운동가들을 도와 만세운동을 성공적으로 이끌었습니다.<br>
      이제 지령서의 마지막장을 사용해 보세요.</p>
    <input type="text" id="answer" placeholder="누구에게 전달해야 할까?">
    <button onclick="checkAnswer()">제출</button>
    <p id="result"></p>
  </div>
</body>
</html>
