<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>돌아와요 통영항에</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-image: url('tong12.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;

      padding-top: 100px; /* 화면 위쪽에 여백 추가 */
    }
    iframe {
      width: 90%;            /* 화면 거의 꽉 차게 */
      max-width: 900px;      /* 너무 넓어지지 않도록 */
      height: 500px;         /* 기본 높이 */
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    /* 모바일 대응 iframe */
    @media (max-width: 768px) {
      iframe {
        height: 320px;       /* 태블릿/중형 화면 */
      }
    }

    @media (max-width: 480px) {
      iframe {
        height: 220px;       /* 스마트폰 */
      }
    }
    .content {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 30px; /* 기존 20px → 30px */
      border-radius: 10px;
      display: inline-block;
    }

    .content h1 {
      font-size: 28px; /* 제목 크기 확대 */
    }

    .content p {
      font-size: 20px; /* 본문 글자 크기 확대 */
      line-height: 1.5; /* 줄간격 확보 */
    }

    input, button {
      font-size: 18px; /* 입력창/버튼 글자 크기 확대 */
      padding: 15px 20px; /* 내부 여백 확대 */
      border-radius: 8px;
      margin: 10px;
    }

    /* 모바일 대응 */
  @media (max-width: 768px) {
    .content {
      padding: 20px;
    }

    .content h1 {
      font-size: 22px; /* 모바일에서 제목 크기 */
    }

    .content p {
      font-size: 18px; /* 모바일에서 본문 크기 */
    }

    input, button {
      font-size: 16px;
      padding: 12px 15px;
    }
  }

  @media (max-width: 480px) {
    .content h1 {
      font-size: 20px;
    }

    .content p {
      font-size: 16px;
    }

    input, button {
      font-size: 14px;
      padding: 10px 12px;
    }
  }
  
    img {
      width: 60%;
      max-width: 600px;
      margin: 20px 0;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <!-- 영상과 본문 사이 이미지 -->
  <img src="tongpassword6.png" alt="설명 이미지">

  <div class="content">
    <h1>3658</h1>
    드디어 마지막 단서입니다.<br>이 숫자들의 의미는 무엇일까요? 그리고 이것과 보물이 무슨 관계가 있을까요?<br>
    문득 처음 초대장을 받았을때 같이 받은 보관함이 기억납니다.<br>혹시 보물은 생각보다 가까운곳에 있지 않았을까요? </p>
  </div>
  </script>
</body>
</html>
