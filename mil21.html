<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>영남제일루</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-image: url('milbg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px; /* 상단 여백 */
    }

    iframe {
      width: 80%;
      max-width: 800px;
      height: 450px;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .content {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 30px;
      border-radius: 10px;
      display: inline-block;
    }

    .content h1 {
      font-size: 28px;
    }

    .content p {
      font-size: 20px;
      line-height: 1.5;
    }

    input, button {
      font-size: 18px;
      padding: 15px 20px;
      border-radius: 8px;
      margin: 10px;
    }

    img {
      width: 60%;
      max-width: 600px;
      margin: 20px 0;
      border-radius: 10px;
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {
      iframe {
        height: 300px;
      }
      .content {
        padding: 20px;
      }
      .content h1 {
        font-size: 22px;
      }
      .content p {
        font-size: 18px;
      }
      input, button {
        font-size: 16px;
        padding: 12px 15px;
      }
    }

    @media (max-width: 480px) {
      iframe {
        height: 200px;
      }
      .content h1 {
        font-size: 20px;
      }
      .content p {
        font-size: 16px;
      }
      input, button {
        font-size: 14px;
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- 영상 -->
  <iframe src="https://naver.me/GFC3pzme" allow="autoplay; encrypted-media" allowfullscreen></iframe>

  <!-- 영상과 본문 사이 이미지 -->

  <div class="content">
    <p>장터에서 독립운동가들의 흔적을 쫓아가다보니 정말로 지령서를 발견했다!<br>
       지령서에는 독립요원이 쓴듯한 메모가 적혀있었다.<br>
       '지금 이곳은 안전하지가 않소.<br>
       일본 경찰의 눈을 피하려면 그 지령서는 당신이 가지고 오는 것이 좋을 것 같소<br>
       일본놈들의 눈을 피해 안전한 장소로 찾아오시오'<br>
       아무래도 다음 지령서에 단서가 될만한 것이 있을 것 같다. <br>
       네번째 지령서를 확인해보자.<br>
  </div>
</body>
</html>
